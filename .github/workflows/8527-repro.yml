name: Issue 8527 RTC metadata reproduction

on:
  push:
    branches:
      - repro/8527-rtc-metadata-size
  pull_request:
    branches:
      - upstream/RC_2_1-4d092f8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Browser WebTorrent RTC metadata reproduction
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install C++ build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-tools-dev libboost-dev libboost-system-dev libboost-json-dev
          echo "using gcc ;" >> ~/user-config.jam

      - name: Install browser test dependencies
        working-directory: test/webtorrent-interop
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run bundle

      - name: Start local WebTorrent tracker
        working-directory: test/webtorrent-interop
        run: |
          node tracker-server.mjs > "$GITHUB_WORKSPACE/tracker.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/tracker.pid"
          for i in $(seq 1 100); do
            if grep -q '\[tracker-listening\]' "$GITHUB_WORKSPACE/tracker.log"; then break; fi
            sleep 0.2
          done
          cat "$GITHUB_WORKSPACE/tracker.log"
          grep -q '\[tracker-listening\]' "$GITHUB_WORKSPACE/tracker.log"

      - name: Build and run C++ seeder plus browser WebTorrent client
        env:
          LIBTORRENT_INTEROP_TRACKER: ws://127.0.0.1:19090
          LIBTORRENT_INTEROP_TORRENT: ${{ github.workspace }}/interop.torrent
          LIBTORRENT_INTEROP_DONE: ${{ github.workspace }}/interop.done
          LIBTORRENT_INTEROP_LOG: ${{ github.workspace }}/libtorrent-interop.log
          LIBTORRENT_INTEROP_JS_LOG: ${{ github.workspace }}/webtorrent-interop.log
        run: |
          set -euxo pipefail
          rm -f interop.torrent interop.done libtorrent-interop.log webtorrent-interop.log
          cd test
          b2 -a -d+2 webtorrent=on warnings-as-errors=on debug-iterators=on asserts=on test_webtorrent_interop > "$GITHUB_WORKSPACE/build-test.log" 2>&1 &
          test_pid=$!
          set +e
          cd webtorrent-interop
          node run-interop.mjs
          js_status=$?
          cd ../..
          wait "$test_pid"
          test_status=$?
          set -e
          cat build-test.log
          cat libtorrent-interop.log || true
          cat webtorrent-interop.log || true
          test "$js_status" -eq 0
          test "$test_status" -eq 0

      - name: Upload interop diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-8527-browser-webtorrent-interop
          path: |
            build-test.log
            tracker.log
            libtorrent-interop.log
            webtorrent-interop.log
          if-no-files-found: warn

      - name: Stop local tracker
        if: always()
        run: |
          if [ -f tracker.pid ]; then kill "$(cat tracker.pid)" 2>/dev/null || true; fi
