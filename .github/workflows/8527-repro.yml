name: Issue 8527 RTC metadata reproduction

on:
  push:
    branches:
      - repro/8527-rtc-metadata-size
  pull_request:
    branches:
      - upstream/RC_2_1-4d092f8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Build and run RTC metadata reproduction
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-tools-dev libboost-dev libboost-system-dev libboost-json-dev
          python3 -m pip install --break-system-packages websockets
          echo "using gcc ;" >> ~/user-config.jam

      - name: Build and run only the RTC WebTorrent transfer test
        run: |
          set -euxo pipefail
          pwd
          command -v b2

          cd test
          # Force compilation so the TORRENT_USE_RTC guard in the test source
          # cannot be bypassed by a stale target or an empty/no-op build.
          b2 -a -d+2 webtorrent=on warnings-as-errors=on debug-iterators=on asserts=on test_webtorrent_transfer

          # Search from the repository root: Boost.Build's test runner can use
          # a target-specific working directory.
          cd ..
          log_file=$(find . -type f -name bep10-handshake.log -print -quit)
          if [ -z "$log_file" ]; then
            echo "BEP 10 handshake log was not created anywhere in the repository."
            echo "RTC test build/run diagnostics above should show whether the target ran."
            find test -maxdepth 7 -type f \( -name '*.log' -o -name 'test_webtorrent_transfer*' \) -print
            exit 1
          fi
          cp "$log_file" bep10-handshake.log
          test -s bep10-handshake.log
          echo "Captured BEP 10 log from: $log_file"
          cat bep10-handshake.log

      - name: Upload BEP 10 handshake log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bep10-handshake-log
          path: bep10-handshake.log
          if-no-files-found: error
          retention-days: 14
