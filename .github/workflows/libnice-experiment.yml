name: libnice backend experiment

on:
  push:
    branches: [ experiment/libnice-ice-backend ]
  pull_request:
    branches: [ RC_2_1 ]

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-and-test-libnice:
    name: Build and test with libnice ICE backend
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1
          filter: tree:0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libboost-dev \
            libboost-system-dev \
            libboost-json-dev \
            libboost-tools-dev \
            libnice-dev \
            ninja-build \
            python3 \
            python3-pip
          python3 -m pip install websockets

      - name: Configure libtorrent with libnice
        env:
          # Required by older CMake policies in vendored libdatachannel dependencies.
          CMAKE_POLICY_VERSION_MINIMUM: 3.5
        run: |
          cmake -B build-libnice -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -Dbuild_tests=ON \
            -Dbuild_examples=ON \
            -Dbuild_tools=ON \
            -Dwebtorrent=ON \
            -DUSE_NICE=ON \
            -Dasserts=ON \
            -DCMAKE_CXX_STANDARD=17
          grep -q '^USE_NICE:BOOL=ON$' build-libnice/CMakeCache.txt

      - name: Build and verify linked backend
        run: |
          cmake --build build-libnice --parallel 2 --verbose 2>&1 | tee build-libnice.log
          grep -F 'libnice' build-libnice.log

      - name: Run tests
        run: ctest --test-dir build-libnice --output-on-failure --timeout 180
